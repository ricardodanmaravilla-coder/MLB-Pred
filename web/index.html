<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MLB Quant Analytics</title><style>body{margin:0;background:#08111f;color:#e8eef8;font:15px system-ui}header{padding:20px;background:#0d1b2e;border-bottom:1px solid #20334f}main{max-width:1050px;margin:auto;padding:18px}.row{display:flex;gap:10px;flex-wrap:wrap}.card{background:#0f2036;border:1px solid #213a5c;border-radius:14px;padding:16px;margin:10px 0;flex:1;min-width:260px}button{background:#2d7dff;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:700}.muted{color:#9eb0c8}.good{color:#61d394}.bad{color:#ff8a8a}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#193554;margin:3px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #213a5c;text-align:left}@media(max-width:600px){main{padding:10px}header{padding:14px}}</style></head><body><header><b>⚾ MLB Quant Analytics · Google Cloud</b><div class="muted">ML + Monte Carlo + Big Data + EV/Kelly</div></header><main><div class="row"><button onclick="loadGames()">Actualizar cartelera</button><button onclick="scan()">🎯 Escanear jornada</button></div><div id="status" class="card">Cargando...</div><div id="scan"></div><h2>Cartelera</h2><div id="games"></div></main><script>const j=async(u,o)=>{let r=await fetch(u,o);let x=await r.json();if(!r.ok)throw Error(x.detail||r.status);return x};async function health(){try{let x=await j('/api/health');status.innerHTML=`<b class=good>● Sistema activo</b><br>Histórico: ${x.history_rows} juegos · ML: ${x.ml_ready?'listo':'sin entrenar'} · Runtime: ${x.runtime}` }catch(e){status.innerHTML='<span class=bad>'+e+'</span>'}}async function loadGames(){games.innerHTML='Cargando...';try{let x=await j('/api/games');games.innerHTML=x.games.map(g=>`<div class=card><b>${g.away} @ ${g.home}</b><br><span class=muted>${g.starter_away} vs ${g.starter_home}</span><br><span class=pill>O/U ${g.line??'N/D'}</span><span class=pill>ML ${g.odds_away??'—'} / ${g.odds_home??'—'}</span><br><button onclick="analyze(${g.game_pk},this)">Analizar</button><div class=result></div></div>`).join('')||'<div class=card>No hay juegos hoy.</div>'}catch(e){games.innerHTML='<div class=card>'+e+'</div>'}}async function analyze(id,b){let d=b.parentElement.querySelector('.result');d.innerHTML='Procesando 50,000 simulaciones...';try{let x=await j('/api/analyze/'+id,{method:'POST'});let p=x.picks;d.innerHTML=`<p><b>ML:</b> Local ${Number(x.model.prob_home).toFixed(1)}% · Visitante ${Number(x.model.prob_away).toFixed(1)}% · Carreras ${Number(x.model.projected_runs).toFixed(1)}</p>`+(p.length?`<table><tr><th>Pick</th><th>Prob.</th><th>EV</th><th>Kelly</th></tr>${p.map(q=>`<tr><td>${q.selection}</td><td>${q.probability}%</td><td>${q.ev_pct}%</td><td>${q.kelly_pct}%</td></tr>`).join('')}</table>`:'<p class=muted>NO BET: sin ventaja suficiente.</p>')}catch(e){d.innerHTML='<span class=bad>'+e+'</span>'}}async function scan(){scan.innerHTML='<div class=card>Escaneando toda la jornada...</div>';try{let x=await j('/api/scan',{method:'POST'});scan.innerHTML='<h2>Top recomendaciones</h2><div class=card>'+(x.recommendations.length?x.recommendations.map((p,i)=>`<p><b>#${i+1} ${p.game}</b><br>${p.selection} · Prob ${p.probability}% · EV ${p.ev_pct}% · Kelly ${p.kelly_pct}%</p>`).join(''):'NO BET hoy: ninguna señal supera los filtros.')+'</div>'}catch(e){scan.innerHTML='<div class=card><span class=bad>'+e+'</span></div>'}}health();loadGames();</script></body></html>

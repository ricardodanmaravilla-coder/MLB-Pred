name: MLB Shadow Candidate

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules can be delayed. Check frequently and use the
    # daily cache lock so Shadow runs once without ever touching V7 writes.
    - cron: '*/5 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: mlb-shadow-candidate
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - name: Determine next pregame timing
        id: timing
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          import json
          import urllib.request

          now = dt.datetime.now(dt.timezone.utc)
          today = now.date().isoformat()
          url = f"https://statsapi.mlb.com/api/v1/schedule?sportId=1&date={today}"
          try:
              with urllib.request.urlopen(url, timeout=15) as r:
                  payload = json.load(r)
          except Exception as exc:
              print("scan_due=false")
              print(f"scan_date={today}")
              print("next_game_utc=")
              print("minutes_to_next=")
              print(f"timing_error={type(exc).__name__}")
              print("settle_due=false")
              raise SystemExit(0)

          future = []
          for day in payload.get("dates", []):
              for game in day.get("games", []):
                  detailed = str(game.get("status", {}).get("detailedState") or "").strip().lower()
                  if detailed in {"postponed", "cancelled", "canceled", "final", "game over", "completed early"}:
                      continue
                  raw = game.get("gameDate")
                  if not raw:
                      continue
                  try:
                      start = dt.datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  except ValueError:
                      continue
                  if start > now:
                      future.append(start)

          if not future:
              print("scan_due=false")
              print(f"scan_date={today}")
              print("next_game_utc=")
              print("minutes_to_next=")
          else:
              next_game = min(future)
              minutes = (next_game - now).total_seconds() / 60.0
              # Catch-up safe: if the first game has already started, use the next
              # unstarted game. Shadow itself filters all started games from its slate.
              due = 0.0 < minutes <= 70.0
              print(f"scan_due={'true' if due else 'false'}")
              print(f"scan_date={today}")
              print(f"next_game_utc={next_game.isoformat()}")
              print(f"minutes_to_next={minutes:.2f}")

          settle_window = (now.hour >= 18 or now.hour <= 6) and now.minute in {0, 30}
          print(f"settle_due={'true' if settle_window else 'false'}")
          PY

      - name: Show timing decision
        run: |
          echo "Next unstarted game UTC: ${{ steps.timing.outputs.next_game_utc }}"
          echo "Minutes to next game: ${{ steps.timing.outputs.minutes_to_next }}"
          echo "Candidate scan due: ${{ steps.timing.outputs.scan_due }}"
          echo "Candidate settlement due: ${{ steps.timing.outputs.settle_due }}"

      - name: Restore daily shadow scan lock
        id: scan_lock
        if: github.event_name == 'schedule' && steps.timing.outputs.scan_due == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .shadow_scan_marker
          key: mlb-shadow-scan-${{ steps.timing.outputs.scan_date }}

      - id: auth
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.timing.outputs.settle_due == 'true' ||
          (steps.timing.outputs.scan_due == 'true' && steps.scan_lock.outputs.cache-hit != 'true')
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve isolated Shadow Cloud Run URL
        id: cloudrun
        if: steps.auth.outcome == 'success'
        shell: bash
        run: |
          URL=$(gcloud run services describe mlb-pred-shadow \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION || 'us-central1' }}" \
            --format='value(status.url)')
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify hard Shadow isolation and readiness
        if: >-
          steps.cloudrun.outputs.url != '' &&
          (github.event_name == 'workflow_dispatch' ||
          (steps.timing.outputs.scan_due == 'true' && steps.scan_lock.outputs.cache-hit != 'true'))
        shell: bash
        run: |
          HEALTH=$(curl -fsS --max-time 180 "${{ steps.cloudrun.outputs.url }}/api/health")
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"service_role":"shadow_only"'
          echo "$HEALTH" | grep -q '"runtime_isolated_from_v7":true'
          echo "$HEALTH" | grep -q '"production_endpoints_exposed":false'
          echo "$HEALTH" | grep -q '"shadow_candidate_ready":true'
          echo "$HEALTH" | grep -q '"odds_configured":true'
          echo "$HEALTH" | grep -q '"google_sheets_configured":true'
          echo "$HEALTH" | grep -q '"worksheet":"MLB_Candidate_Picks"'

      - name: Run isolated Shadow scanner before next unstarted game
        if: >-
          steps.cloudrun.outputs.url != '' &&
          (github.event_name == 'workflow_dispatch' ||
          (steps.timing.outputs.scan_due == 'true' && steps.scan_lock.outputs.cache-hit != 'true'))
        shell: bash
        run: |
          RESPONSE=$(curl -fsS --max-time 600 -X POST "${{ steps.cloudrun.outputs.url }}/api/candidate/scan?persist=true")
          echo "$RESPONSE"
          printf '%s' "$RESPONSE" > /tmp/shadow-scan.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/shadow-scan.json'))
          assert d.get('mode') == 'shadow_candidate_only'
          assert d.get('service') == 'mlb-pred-shadow'
          assert d.get('runtime_isolated_from_v7') is True
          assert d.get('worksheet') == 'MLB_Candidate_Picks'
          assert d.get('production_write') is False
          recs=d.get('recommendations') or []
          diag=d.get('diagnostics') or []
          errs=d.get('errors') or []
          assert diag or recs, f'No evaluable candidate markets: {errs[:3]}'
          if recs:
              sheet=d.get('sheet') or {}
              assert sheet.get('ok') is True, f'Sheet write failed: {sheet}'
          print('shadow recommendations=',len(recs),'diagnostics=',len(diag),'errors=',len(errs))
          PY
          mkdir -p .shadow_scan_marker
          printf '%s\n' "${{ steps.timing.outputs.scan_date }} ${{ steps.timing.outputs.next_game_utc }}" > .shadow_scan_marker/completed.txt

      - name: Save daily shadow scan lock
        if: >-
          github.event_name == 'schedule' &&
          steps.timing.outputs.scan_due == 'true' &&
          steps.scan_lock.outputs.cache-hit != 'true' &&
          success()
        uses: actions/cache/save@v4
        with:
          path: .shadow_scan_marker
          key: mlb-shadow-scan-${{ steps.timing.outputs.scan_date }}

      - name: Settle candidate picks only
        if: >-
          steps.cloudrun.outputs.url != '' &&
          (github.event_name == 'workflow_dispatch' || steps.timing.outputs.settle_due == 'true')
        run: |
          RESPONSE=$(curl -fsS --max-time 180 -X POST "${{ steps.cloudrun.outputs.url }}/api/candidate/settle")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"production_write":false'

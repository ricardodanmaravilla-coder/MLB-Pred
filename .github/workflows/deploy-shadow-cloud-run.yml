name: Deploy MLB Shadow to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web_shadow.py'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'build_bigdata.py'
      - 'modules/web_service.py'
      - 'modules/enriched_web_service.py'
      - 'modules/shadow_candidate.py'
      - 'modules/candidate_isolation.py'
      - 'modules/live_sheet_settlement.py'
      - 'modules/google_sheets_ledger.py'
      - 'modules/pick_ledger.py'
      - 'modules/therundown_odds.py'
      - 'models/shadow_candidate.joblib'
      - 'models/shadow_candidate.json'
      - 'data/shadow/starter_performance_history.csv'
      - 'data/mlb_games.csv'
      - 'data/mlb_batting.csv'
      - 'data/mlb_pitching.csv'
      - 'data/mlb_pitching_individual.csv'
      - 'data/mlb_bullpen.csv'
      - 'data/mlb_park_factors.csv'
      - '.github/workflows/deploy-shadow-cloud-run.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-mlb-shadow
  cancel-in-progress: true

jobs:
  deploy-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require deployable Shadow bundle
        run: |
          test -s models/shadow_candidate.joblib
          test -s models/shadow_candidate.json
          test -s data/shadow/starter_performance_history.csv

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Resolve safe runtime bindings from V7
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
        run: |
          gcloud run services describe mlb-pred-v7 \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json > /tmp/v7.json
          V7_URL=$(gcloud run services describe mlb-pred-v7 \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')
          test -n "$V7_URL"
          echo "MLB_PROD_URL=$V7_URL" >> "$GITHUB_ENV"
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          p=json.load(open('/tmp/v7.json'))
          spec=p.get('spec',{}).get('template',{}).get('spec',{})
          print('SHADOW_RUNTIME_SA=' + str(spec.get('serviceAccountName') or ''))
          containers=spec.get('containers') or []
          envs=(containers[0].get('env') or []) if containers else []
          vals={e.get('name'):e.get('value','') for e in envs if isinstance(e,dict) and e.get('value') is not None}
          # Sheet ID is configuration, not a credential. Prefer V7's configured value;
          # retain the known MLB tracking workbook as a safe fallback.
          print('SHADOW_SHEET_ID=' + str(vals.get('GOOGLE_SHEETS_ID') or '1VsB21QUsQL5EyXu7Sek5WVeNVznECiTuoIMMB4JXno4'))
          print('SHADOW_BANKROLL=' + str(vals.get('BANKROLL_MXN') or '5000'))
          names=[]
          for e in envs:
              if not isinstance(e,dict):
                  continue
              n=e.get('name')
              if n in {'ODDS_API_KEY','THERUNDOWN_KEY','ODDS_API_IO_KEY','SHARPAPI_KEY','GOOGLE_SHEETS_ID','BANKROLL_MXN','GOOGLE_SERVICE_ACCOUNT_JSON'}:
                  source='secret_ref' if e.get('valueFrom') else 'plain_value'
                  names.append(f'{n}:{source}')
          print('V7_BINDING_SUMMARY=' + ','.join(names))
          PY

      - name: Validate read-only fallback and Sheets access target
        run: |
          test -n "$MLB_PROD_URL"
          test -n "$SHADOW_SHEET_ID"
          test -n "$SHADOW_BANKROLL"
          echo "V7 bindings present: $V7_BINDING_SUMMARY"
          curl -fsS --max-time 180 "$MLB_PROD_URL/api/slate" -o /tmp/v7-slate.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/v7-slate.json'))
          games=d.get('games') or []
          ml=sum(1 for g in games if g.get('cuota_loc') is not None and g.get('cuota_vis') is not None)
          totals=sum(1 for g in games if g.get('linea_carreras') is not None)
          print('V7 slate games=',len(games),'moneyline=',ml,'totals=',totals)
          assert games, 'V7 slate is empty'
          assert ml > 0 and totals > 0, 'V7 public slate has no usable live markets'
          PY

      - name: Deploy isolated Shadow service
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
        run: |
          SA_ARG=()
          if test -n "$SHADOW_RUNTIME_SA"; then
            SA_ARG=(--service-account "$SHADOW_RUNTIME_SA")
          fi
          gcloud run deploy mlb-pred-shadow \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 2 \
            --memory 2Gi \
            --concurrency 2 \
            --timeout 900 \
            --min 0 \
            --max 2 \
            --command uvicorn \
            --args="web_shadow:app,--host,0.0.0.0,--port,8080,--workers,1,--timeout-keep-alive,75" \
            "${SA_ARG[@]}" \
            --update-env-vars="MLB_DATA_DIR=data,MLB_PROD_URL=$MLB_PROD_URL,GOOGLE_SHEETS_ID=$SHADOW_SHEET_ID,BANKROLL_MXN=$SHADOW_BANKROLL"

      - name: Verify isolated Shadow runtime and live dependencies
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
        run: |
          URL=$(gcloud run services describe mlb-pred-shadow \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')
          test -n "$URL"
          curl -fsS --max-time 180 "$URL/api/health" -o /tmp/health.json
          cat /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('service_role') == 'shadow_only'
          assert d.get('runtime_isolated_from_v7') is True
          assert d.get('production_endpoints_exposed') is False
          assert d.get('production_write') is False
          assert d.get('worksheet') == 'MLB_Candidate_Picks'
          assert d.get('shadow_candidate_ready') is True
          assert d.get('odds_configured') is True
          assert d.get('google_sheets_configured') is True
          print('Shadow health OK; odds provider=', d.get('shadow_odds_provider'))
          PY

          curl -fsS --max-time 600 -X POST "$URL/api/candidate/scan?persist=true" -o /tmp/scan.json
          cat /tmp/scan.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/scan.json'))
          assert d.get('mode') == 'shadow_candidate_only'
          assert d.get('service') == 'mlb-pred-shadow'
          assert d.get('runtime_isolated_from_v7') is True
          assert d.get('production_write') is False
          assert d.get('worksheet') == 'MLB_Candidate_Picks'
          recs=d.get('recommendations') or []
          diag=d.get('diagnostics') or []
          errs=d.get('errors') or []
          odds_errors=[e for e in errs if 'Cuotas/total no disponibles' in str(e)]
          assert diag or recs, f'No evaluable Shadow markets; errors={errs[:3]}'
          assert len(odds_errors) < max(1, len(errs)), 'All remaining games lack odds'
          sheet=d.get('sheet')
          if recs:
              assert isinstance(sheet,dict) and sheet.get('ok') is True, f'Shadow sheet write failed: {sheet}'
          print('Shadow scan OK recommendations=',len(recs),'diagnostics=',len(diag),'errors=',len(errs),'sheet=',sheet)
          PY

          curl -fsS --max-time 180 -X POST "$URL/api/candidate/settle" -o /tmp/settle.json
          cat /tmp/settle.json

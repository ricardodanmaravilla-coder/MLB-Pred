name: Apply MLB offense/starter V3 once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-offense-starter-v3-once.yml']

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded offense/starter patch
        run: |
          git fetch origin repair-system-v3
          git checkout -B repair-system-v3 origin/repair-system-v3
          python tools/patch_offense_starter_v3.py
          python -m py_compile app_mlb.py modules/*.py
      - name: Commit patched app to repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mlb.py
          git commit -m 'Normalize current offense and resolve starters safely' || exit 0
          git push origin HEAD:repair-system-v3

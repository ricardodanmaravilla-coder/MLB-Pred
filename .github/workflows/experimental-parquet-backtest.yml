name: MLB Experimental Parquet Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 1'
  push:
    branches: [main]
    paths:
      - 'modules/experimental_parquet.py'
      - 'modules/shadow_bigdata_features.py'
      - 'backtest_experimental_parquet.py'
      - 'backtest_experimental_daynight.py'
      - 'backtest_experimental_ablation.py'
      - 'backtest_experimental_walkforward.py'
      - 'build_game_starters_history.py'
      - 'prepare_experimental_starters.py'
      - 'build_starter_performance_history.py'
      - 'build_bullpen_usage_history.py'
      - 'prepare_experimental_bullpen.py'
      - 'enrich_experimental_context.py'
      - 'enrich_experimental_daynight.py'
      - 'prepare_experimental_statcast.py'
      - 'train_shadow_candidate.py'
      - '.github/workflows/experimental-parquet-backtest.yml'

permissions:
  contents: write

concurrency:
  group: mlb-shadow-model-build
  cancel-in-progress: false

jobs:
  research-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Populate exact historical starters
        run: python prepare_experimental_starters.py
      - name: Build historical starter performance
        run: python build_starter_performance_history.py
      - name: Build historical bullpen usage
        run: python prepare_experimental_bullpen.py
      - name: Build isolated research Parquet
        run: python -m modules.experimental_parquet
      - name: Enrich Parquet with real pregame context
        run: python enrich_experimental_context.py
      - name: Enrich Parquet with starter Day-Night splits
        run: python enrich_experimental_daynight.py
      - name: Enrich Parquet with real Statcast
        run: python prepare_experimental_statcast.py
      - name: Verify production isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = (
              'experimental_parquet','shadow_bigdata_features','prepare_experimental_starters',
              'build_starter_performance_history','prepare_experimental_bullpen',
              'enrich_experimental_context','enrich_experimental_daynight',
              'backtest_experimental_daynight','backtest_experimental_ablation',
              'backtest_experimental_walkforward','prepare_experimental_statcast',
          )
          for p in ('modules/web_service.py','modules/ml_mlb.py','web_app.py'):
              text=Path(p).read_text(encoding='utf-8')
              for marker in forbidden:
                  assert marker not in text, f'Production imports experiment {marker}: {p}'
          print('Production isolation OK')
          PY
      - name: Run exhaustive semantic ablation
        run: python backtest_experimental_ablation.py
      - name: Run multi-season walk-forward
        run: python backtest_experimental_walkforward.py
      - name: Print research robustness diagnostics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/experimental_ablation_backtest.json').read_text())
          w=json.loads(Path('artifacts/experimental_walkforward_backtest.json').read_text())
          print('ABLATION_PROMOTE=',a['PROMOTE_TO_INTEGRATION_REVIEW'])
          print('WALKFORWARD_PROMOTE=',w['PROMOTE_TO_INTEGRATION_REVIEW'])
          print('robust_candidates=',w['robust_candidates'])
          PY
      - name: Train isolated Shadow Big Data v3
        run: python train_shadow_candidate.py
      - name: Verify deployable Shadow Big Data bundle
        run: |
          test -s models/shadow_candidate.joblib
          test -s models/shadow_candidate.json
          test -s data/shadow/starter_performance_history.csv
          test -s data/shadow/bullpen_usage_history.csv
          test -s data/shadow/statcast_team_daily_real.csv
          python - <<'PY'
          from modules.shadow_candidate import available, metadata
          assert available(), 'Shadow Big Data bundle was built but is not loadable'
          m = metadata()
          assert m.get('version') == 'shadow-bigdata-v3', m
          assert int(m.get('feature_count') or 0) >= 40, m
          assert m.get('validation'), m
          print('Deployable isolated Shadow Big Data bundle OK:', m)
          PY
      - name: Commit Shadow Big Data artifact and runtime histories
        run: |
          set -euo pipefail
          SOURCE_ROOT="$GITHUB_WORKSPACE"
          PUBLISH_DIR="$RUNNER_TEMP/shadow-bigdata-publish"
          ARTIFACTS=(
            "models/shadow_candidate.joblib"
            "models/shadow_candidate.json"
            "data/shadow/starter_performance_history.csv"
            "data/shadow/bullpen_usage_history.csv"
            "data/shadow/statcast_team_daily_real.csv"
          )

          copy_shadow_artifacts() {
            mkdir -p "$PUBLISH_DIR/models" "$PUBLISH_DIR/data/shadow"
            for artifact in "${ARTIFACTS[@]}"; do
              test -s "$SOURCE_ROOT/$artifact"
              cp -f "$SOURCE_ROOT/$artifact" "$PUBLISH_DIR/$artifact"
            done
          }

          # Publish from a clean checkout of the latest main instead of rebasing the
          # long-running research workspace. That workspace contains many generated
          # research files and can legitimately be dirty after the Big Data build.
          rm -rf "$PUBLISH_DIR"
          git fetch origin main
          git worktree add --detach "$PUBLISH_DIR" origin/main
          copy_shadow_artifacts

          cd "$PUBLISH_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git add -f "${ARTIFACTS[@]}"
            if git diff --cached --quiet; then
              echo "Shadow Big Data artifacts already match latest main"
              exit 0
            fi

            git commit -m "Refresh MLB Shadow Big Data v3 artifact"
            if git push origin HEAD:main; then
              echo "Shadow Big Data v3 artifacts published successfully"
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Failed to publish Shadow Big Data v3 artifacts after 5 clean-worktree attempts"
              exit 1
            fi

            # main may move while this job is publishing odds/history. Rebuild the
            # artifact commit on top of the new tip without touching V7 or carrying
            # any unrelated generated files from the research workspace.
            git fetch origin main
            git reset --hard origin/main
            copy_shadow_artifacts
            sleep $((attempt * 3))
          done
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlb-experimental-parquet-robustness
          path: |
            data/experimental/mlb_research_features_v1_coverage.json
            data/experimental/statcast_team_daily_real.csv
            artifacts/experimental_ablation_backtest.json
            artifacts/experimental_walkforward_backtest.json
            models/shadow_candidate.json
          if-no-files-found: error

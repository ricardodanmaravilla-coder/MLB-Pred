name: MLB Experimental Parquet Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 1'
  push:
    branches: [main]
    paths:
      - 'modules/experimental_parquet.py'
      - 'backtest_experimental_parquet.py'
      - 'backtest_experimental_daynight.py'
      - 'backtest_experimental_ablation.py'
      - 'backtest_experimental_walkforward.py'
      - 'build_game_starters_history.py'
      - 'prepare_experimental_starters.py'
      - 'build_starter_performance_history.py'
      - 'build_bullpen_usage_history.py'
      - 'prepare_experimental_bullpen.py'
      - 'enrich_experimental_context.py'
      - 'enrich_experimental_daynight.py'
      - 'prepare_experimental_statcast.py'
      - 'train_shadow_candidate.py'
      - '.github/workflows/experimental-parquet-backtest.yml'

permissions:
  contents: write

concurrency:
  group: mlb-shadow-model-build
  cancel-in-progress: false

jobs:
  research-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Populate exact historical starters
        run: python prepare_experimental_starters.py
      - name: Build historical starter performance
        run: python build_starter_performance_history.py
      - name: Build historical bullpen usage
        run: python prepare_experimental_bullpen.py
      - name: Build isolated research Parquet
        run: python -m modules.experimental_parquet
      - name: Enrich Parquet with real pregame context
        run: python enrich_experimental_context.py
      - name: Enrich Parquet with starter Day-Night splits
        run: python enrich_experimental_daynight.py
      - name: Enrich Parquet with real Statcast
        run: python prepare_experimental_statcast.py
      - name: Verify production isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = (
              'experimental_parquet','prepare_experimental_starters','build_starter_performance_history',
              'prepare_experimental_bullpen','enrich_experimental_context','enrich_experimental_daynight',
              'backtest_experimental_daynight','backtest_experimental_ablation','backtest_experimental_walkforward',
              'prepare_experimental_statcast',
          )
          for p in ('modules/web_service.py','modules/ml_mlb.py','web_app.py'):
              text=Path(p).read_text(encoding='utf-8')
              for marker in forbidden:
                  assert marker not in text, f'Production imports experiment {marker}: {p}'
          print('Production isolation OK')
          PY
      - name: Run exhaustive semantic ablation
        run: python backtest_experimental_ablation.py
      - name: Run multi-season walk-forward
        run: python backtest_experimental_walkforward.py
      - name: Print robustness gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/experimental_ablation_backtest.json').read_text())
          w=json.loads(Path('artifacts/experimental_walkforward_backtest.json').read_text())
          print('ABLATION_PROMOTE=',a['PROMOTE_TO_INTEGRATION_REVIEW'])
          print('WALKFORWARD_PROMOTE=',w['PROMOTE_TO_INTEGRATION_REVIEW'])
          print('robust_candidates=',w['robust_candidates'])
          PY
      - name: Train frozen shadow candidate
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          w=json.loads(Path('artifacts/experimental_walkforward_backtest.json').read_text())
          if 'ablation_best' not in w.get('robust_candidates', []):
              raise SystemExit('Frozen starter_day_night+team_context candidate did not pass walk-forward gate')
          subprocess.check_call(['python','train_shadow_candidate.py'])
          PY
      - name: Verify deployable Shadow bundle
        run: |
          test -s models/shadow_candidate.joblib
          test -s models/shadow_candidate.json
          test -s data/shadow/starter_performance_history.csv
          python - <<'PY'
          from modules.shadow_candidate import available, metadata
          assert available(), 'Shadow bundle was built but is not loadable'
          m = metadata()
          assert m.get('version'), 'Shadow model version missing'
          assert m.get('training_rows'), 'Shadow training row count missing'
          print('Deployable isolated Shadow bundle OK:', m)
          PY
      - name: Commit shadow candidate artifact and starter history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/shadow_candidate.joblib models/shadow_candidate.json data/shadow/starter_performance_history.csv
          if git diff --cached --quiet; then
            echo "Shadow candidate artifacts unchanged"
          else
            git commit -m "Refresh validated MLB shadow candidate"
            git push
          fi
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlb-experimental-parquet-robustness
          path: |
            data/experimental/mlb_research_features_v1_coverage.json
            data/experimental/statcast_team_daily_real.csv
            artifacts/experimental_ablation_backtest.json
            artifacts/experimental_walkforward_backtest.json
            models/shadow_candidate.json
          if-no-files-found: error

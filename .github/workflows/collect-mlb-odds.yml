name: Collect MLB Pregame Odds

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'snapshot_mlb_odds.py'
      - '.github/workflows/collect-mlb-odds.yml'

concurrency:
  group: mlb-odds-archive
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Authenticate to Google Cloud for service discovery
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Discover production Cloud Run URL
        run: |
          URL=$(gcloud run services describe mlb-pred-v7 \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION || 'us-central1' }}" \
            --format='value(status.url)')
          test -n "$URL"
          echo "MLB_PROD_URL=$URL" >> "$GITHUB_ENV"
          echo "Cloud Run service discovered"
      - name: Snapshot real pregame odds
        env:
          THERUNDOWN_KEY: ${{ secrets.THERUNDOWN_KEY }}
          THERUNDOWN_AFFILIATE_IDS: '19,22,23'
        run: python snapshot_mlb_odds.py
      - name: Validate archive schema
        run: |
          python - <<'PY'
          import pandas as pd
          p='data/mlb_odds_history.csv'
          d=pd.read_csv(p)
          req={'snapshot_utc','event_id','commence_time_utc','home','away','book','market','selection','odds_decimal'}
          assert req.issubset(d.columns), f'Faltan columnas: {sorted(req-set(d.columns))}'
          print('Odds archive rows:',len(d))
          PY
      - name: Commit new odds snapshots
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/mlb_odds_history.csv
          if git diff --cached --quiet; then
            echo "No new odds snapshot"
            exit 0
          fi
          git commit -m "Archive MLB pregame odds"
          for attempt in 1 2 3; do
            git pull origin main --rebase && git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

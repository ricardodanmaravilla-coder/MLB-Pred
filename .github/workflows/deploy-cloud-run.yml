name: Deploy MLB to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web_app.py'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'build_bigdata.py'
      - 'modules/ml_mlb.py'
      - 'modules/bigdata_mlb.py'
      - 'modules/bigdata_tracking.py'
      - 'modules/web_service.py'
      - 'modules/enriched_web_service.py'
      - 'modules/shadow_candidate.py'
      - 'modules/candidate_isolation.py'
      - 'modules/live_sheet_settlement.py'
      - 'modules/google_sheets_ledger.py'
      - 'modules/pick_ledger.py'
      - 'models/shadow_candidate.joblib'
      - 'models/shadow_candidate.json'
      - 'data/shadow/starter_performance_history.csv'
      - 'data/mlb_games.csv'
      - 'data/mlb_batting.csv'
      - 'data/mlb_pitching.csv'
      - 'data/mlb_pitching_individual.csv'
      - 'data/mlb_bullpen.csv'
      - 'data/mlb_park_factors.csv'
      - '.github/workflows/deploy-cloud-run.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy source to Cloud Run
        run: |
          gcloud run deploy mlb-pred-v7 \
            --source . \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION || 'us-central1' }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 2 \
            --memory 2Gi \
            --concurrency 4 \
            --timeout 900 \
            --min 0 \
            --max 3 \
            --update-env-vars="MLB_DATA_DIR=data"
      - name: Verify production and isolated candidate endpoints
        run: |
          URL=$(gcloud run services describe mlb-pred-v7 \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION || 'us-central1' }}" \
            --format='value(status.url)')
          test -n "$URL"
          HEALTH=$(curl -fsS --max-time 180 "$URL/api/health")
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"candidate_isolation":true'
          curl -fsS --max-time 180 -X POST "$URL/api/settle"
          if test -f models/shadow_candidate.joblib; then
            echo "$HEALTH" | grep -q '"shadow_candidate_ready":true'
            CANDIDATE=$(curl -fsS --max-time 600 -X POST "$URL/api/candidate/scan?persist=false")
            echo "$CANDIDATE"
            echo "$CANDIDATE" | grep -q '"mode":"shadow_candidate_only"'
            echo "$CANDIDATE" | grep -q '"production_write":false'
          fi

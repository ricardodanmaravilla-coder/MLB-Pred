name: Diagnose MLB Google Sheets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-sheets.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Inspect Cloud Run Sheets configuration safely
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
        run: |
          gcloud run services describe mlb-pred-v7 \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json > /tmp/service.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/service.json'))
          spec=p.get('spec',{}).get('template',{}).get('spec',{})
          service_account=spec.get('serviceAccountName') or '(default)'
          containers=spec.get('containers') or []
          envs=(containers[0].get('env') or []) if containers else []
          names={e.get('name') for e in envs}
          print('runtime_service_account=', service_account)
          for key in ['GOOGLE_SHEETS_ID','GOOGLE_SHEETS_WORKSHEET','GOOGLE_SERVICE_ACCOUNT_JSON','BANKROLL_MXN','MLB_DATA_DIR']:
              print(f'{key}_configured=', key in names)
          print('env_names=', ','.join(sorted(x for x in names if x and ('SHEET' in x or x in {'BANKROLL_MXN','MLB_DATA_DIR'}))))
          PY
      - name: Check live health endpoint
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
        run: |
          URL=$(gcloud run services describe mlb-pred-v7 --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          curl -fsS --max-time 120 "$URL/api/health" -o /tmp/health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/health.json'))
          safe={k:data.get(k) for k in ['status','service','model_ready','ledger_persistent','slate_date']}
          print(json.dumps(safe, indent=2))
          PY
      - name: Trigger live scanner persistence test
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
        run: |
          URL=$(gcloud run services describe mlb-pred-v7 --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          curl -fsS --max-time 900 -X POST "$URL/api/scan?persist=true" -o /tmp/scan.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/scan.json'))
          recs=d.get('recommendations') or []
          errs=d.get('errors') or []
          print('games_seen=',d.get('games_seen'))
          print('recommendations=',len(recs))
          print('scanner_errors=',len(errs))
          for r in recs:
              print('pick=',r.get('game_pk'),r.get('mercado'),r.get('apuesta'))
          for e in errs[:5]:
              print('scanner_error=',e)
          PY
      - name: Read recent Sheets sync logs if permitted
        continue-on-error: true
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="mlb-pred-v7" AND textPayload:"Google Sheets"' \
            --project "$PROJECT_ID" --freshness=2h --limit=20 --format='value(timestamp,textPayload)'

name: Actualizar Datos MLB

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar_datos_mlb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install pandas requests MLB-StatsAPI
      - name: Ejecutar minero MLB
        run: python minero_mlb.py
      - name: Guardar datos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/mlb_batting.csv data/mlb_pitching.csv data/mlb_games.csv
          git commit -m "Actualizacion diaria datos MLB" || echo "Sin cambios"
          git pull origin main --rebase
          git push origin main

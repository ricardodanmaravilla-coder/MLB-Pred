name: Actualizar Sabermetria MLB (Minero)

on:
  schedule:
    # Se ejecuta todos los días a las 11:00 AM UTC
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic

permissions:
  contents: write

jobs:
  actualizar_datos_mlb:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Copiar repositorio
      uses: actions/checkout@v3

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests lxml MLB-StatsAPI pybaseball

    - name: ⛏️ Ejecutar Minero MLB
      run: |
        python minero_mlb.py

    - name: ⚙️ Configurar credenciales de Git
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"

    - name: 🚀 Guardar y subir CSVs al repositorio
      run: |
        git status
        git add data/*.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización diaria de Sabermetría y Park Factors MLB" && git pull --rebase origin main && git push origin main)

name: Actualizar Pitchers y Bullpen MLB

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  minar_pitchers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install pandas requests
      - name: Ejecutar minero pitchers/bullpen
        run: python minero_pitchers.py
      - name: Guardar datos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/mlb_pitching_individual.csv data/mlb_bullpen.csv
          git commit -m "Actualizacion pitchers y bullpen MLB" || echo "Sin cambios"
          git pull origin main --rebase
          git push origin main

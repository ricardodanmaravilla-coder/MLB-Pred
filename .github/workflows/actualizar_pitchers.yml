name: Actualizar Pitchers Reales (Minero)

on:
  schedule:
    - cron: '0 11 * * *' # Todos los días a las 11:00 AM UTC
  workflow_dispatch:      # Permite ejecutarlo manualmente

permissions:
  contents: write

jobs:
  minar_pitchers:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Copiar repositorio
      uses: actions/checkout@v3

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas lxml beautifulsoup4 requests

    - name: ⛏️ Ejecutar Minero Pitchers
      run: |
        python minero_pitchers.py
        ls -R data/  # Verifica si el archivo se creó y cuánto pesa

    - name: 🚀 Subir datos al repositorio
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add data/mlb_pitching_individual.csv
        git commit -m "🤖 Actualización de lanzadores individuales reales" || echo "Sin cambios"
        git pull origin main --rebase --strategy-option theirs
        git push origin main

name: MLB Big Data integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/bigdata-v1]

jobs:
  bigdata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Compile Big Data modules
        run: python -m py_compile modules/bigdata_mlb.py modules/ml_mlb.py build_bigdata.py test_bigdata_mlb.py test_bigdata_integration.py
      - name: Leak-safety unit tests
        run: pytest -q test_bigdata_mlb.py
      - name: End-to-end warehouse + ML integration
        run: python test_bigdata_integration.py
      - name: Build repository warehouse
        run: python build_bigdata.py
      - name: Verify warehouse status
        run: |
          python - <<'PY'
          from modules.bigdata_mlb import MLBDataWarehouse
          s=MLBDataWarehouse().status()
          assert s['games'] > 1000
          assert s['features'] > 1000
          assert s['feature_version'] == 'bd_v2'
          print(s)
          PY

name: MLB Streamlit rerun cache check

on:
  push:
    branches: [hotfix-cache-model]
  pull_request:
    branches: [main]

jobs:
  validate-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app_mlb.py app_mlb_v2.py modules/runtime_guard.py modules
      - name: Model reuse smoke
        run: |
          python - <<'PY'
          import pandas as pd
          import modules.ml_mlb as ml_mod
          from modules.runtime_guard import install_runtime_guards, CachedPredictor
          install_runtime_guards()
          bat=pd.read_csv('data/mlb_batting.csv')
          pit=pd.read_csv('data/mlb_pitching.csv')
          games=pd.read_csv('data/mlb_games.csv')
          m1=ml_mod.PredictorMLMLB(); assert m1.entrenar(bat,pit,games)
          assert CachedPredictor._cached_state is not None
          first_model=m1.modelo_ganador
          m2=ml_mod.PredictorMLMLB(); assert m2.entrenar(bat,pit,games)
          assert m2.modelo_ganador is first_model
          assert m2.entrenado and m2.calibrado
          print('cached predictor reused fitted estimators')
          PY
      - name: Production Streamlit startup
        run: |
          streamlit run app_mlb.py --server.headless true --server.port 8501 >/tmp/mlb-cache.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then cat /tmp/mlb-cache.log; kill $PID || true; exit 1; fi
          kill $PID || true

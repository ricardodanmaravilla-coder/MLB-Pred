name: Validate MLB Bullpen Availability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build_bullpen_usage_history.py'
      - 'backtest_bullpen_walkforward.py'
      - 'validate_enrichment.py'
      - '.github/workflows/validate-bullpen.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test official MLB game feed
        run: |
          python - <<'PY'
          import requests
          r=requests.get('https://statsapi.mlb.com/api/v1.1/game/777000/feed/live',timeout=20)
          print('MLB feed endpoint reachable:', r.status_code)
          assert r.status_code in (200,404), 'MLB game feed endpoint unavailable'
          PY

      - name: Build historical real bullpen usage
        run: python build_bullpen_usage_history.py

      - name: Generate nested walk-forward bullpen predictions
        run: python backtest_bullpen_walkforward.py

      - name: Evaluate bullpen promotion gate
        run: python validate_enrichment.py artifacts/bullpen_walkforward_predictions.csv --json-out artifacts/bullpen_validation.json

      - name: Upload bullpen validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bullpen-validation
          path: |
            data/mlb_bullpen_usage_history.csv
            artifacts/bullpen_walkforward_predictions.csv
            artifacts/bullpen_walkforward_report.json
            artifacts/bullpen_validation.json
          if-no-files-found: warn
          retention-days: 14

name: Apply V6 predictive patch

on:
  push:
    branches: [improve/v6-max-predictive]
    paths:
      - tools/apply_v6_predictive_patch.py
      - .github/workflows/apply-v6-predictive.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/v6-max-predictive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/apply_v6_predictive_patch.py
      - run: python -m py_compile app_mlb.py modules/*.py minero_mlb.py minero_pitchers.py
      - name: Commit V6 app integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mlb.py
          git commit -m 'Apply V6 predictive integration'
          git push origin HEAD:improve/v6-max-predictive

name: Apply V5 integrity patch

on:
  push:
    branches: [repair/v5-integrity]
    paths:
      - tools/apply_v5_integrity_patch.py
      - .github/workflows/apply-v5-integrity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v5-integrity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic V5 patch
        run: python tools/apply_v5_integrity_patch.py
      - name: Compile patched Python
        run: python -m py_compile app_mlb.py modules/ml_mlb.py modules/game_context.py modules/scanner_engine.py modules/montecarlo_mlb.py minero_pitchers.py
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mlb.py modules/ml_mlb.py
          git commit -m 'Apply V5 app and ML integrity fixes'
          git push origin HEAD:repair/v5-integrity

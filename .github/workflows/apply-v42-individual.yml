name: Apply V4.2 individual patch

on:
  push:
    branches: [repair/unify-individual-v4.2-patch]
    paths:
      - tools/apply_v42_individual_patch.py
      - .github/workflows/apply-v42-individual.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/unify-individual-v4.2-patch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic patch
        run: python tools/apply_v42_individual_patch.py
      - name: Compile patched app
        run: python -m py_compile app_mlb.py
      - name: Commit patched app
        run: |
          if git diff --quiet -- app_mlb.py; then
            echo 'No app change detected'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mlb.py
          git commit -m 'Unify individual picks with scanner engine'
          git push origin HEAD:repair/unify-individual-v4.2-patch

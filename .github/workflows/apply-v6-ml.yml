name: Apply V6 ML patch
on:
  push:
    branches: [upgrade/v6-max-predictive]
    paths:
      - tools/apply_v6_ml_patch.py
      - .github/workflows/apply-v6-ml.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/v6-max-predictive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas>=2.0,<3.0' 'numpy>=1.24,<3.0' 'scikit-learn>=1.3,<2.0'
      - run: python tools/apply_v6_ml_patch.py
      - run: python -m py_compile modules/ml_mlb.py
      - name: Commit ML patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/ml_mlb.py
          git commit -m 'V6 temporal model selection and enhanced form features'
          git push origin HEAD:upgrade/v6-max-predictive

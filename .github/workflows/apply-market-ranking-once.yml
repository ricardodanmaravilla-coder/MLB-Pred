name: Apply market ranking patch once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-market-ranking-once.yml']

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout repair branch and apply guarded patch
        run: |
          git fetch origin fix-market-ranking
          git checkout -B fix-market-ranking origin/fix-market-ranking
          python tools/patch_market_ranking.py
          python -m py_compile app_mlb.py
      - name: Commit exact app patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mlb.py
          git commit -m 'Rank MLB markets by edge and EV' || exit 0
          git push origin HEAD:fix-market-ranking

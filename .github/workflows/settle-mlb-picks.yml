name: Settle MLB Picks

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 18-23 * * *'
    - cron: '*/30 0-6 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: settle-mlb-picks
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Settle pending picks from official MLB scores
        run: |
          URL=$(gcloud run services describe mlb-pred-v7 \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION || 'us-central1' }}" \
            --format='value(status.url)')
          test -n "$URL"
          curl -fsS --max-time 180 -X POST "$URL/api/settle"

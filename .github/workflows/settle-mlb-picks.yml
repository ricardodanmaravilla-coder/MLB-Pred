name: Settle MLB Picks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/settle-mlb-picks.yml'
      - 'modules/live_sheet_settlement.py'
  schedule:
    # Run all day. West-coast and extra-inning games can finish after 06:30 UTC;
    # the previous window left a long gap until 18:00 UTC and stranded pending rows.
    - cron: '*/30 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: settle-mlb-picks
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Settle pending picks from official MLB scores
        run: |
          URL=$(gcloud run services describe mlb-pred-v7 \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION || 'us-central1' }}" \
            --format='value(status.url)')
          test -n "$URL"
          RESPONSE=$(curl -fsS --max-time 180 -X POST "$URL/api/settle")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'

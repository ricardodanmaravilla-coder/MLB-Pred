name: Apply guarded runline patch

on:
  push:
    branches: [fix-runline-balance]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-runline-balance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact patch if needed
        run: |
          if grep -q 'prob_comb_sp_loc' app_mlb.py && grep -q 'viento_mph=viento_scan' app_mlb.py; then
            echo 'Patch already present.'
          else
            python tools/patch_runline_balance.py
          fi
          python -m py_compile app_mlb.py
      - name: Commit patched app
        run: |
          if git diff --quiet -- app_mlb.py; then
            echo 'No app changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mlb.py
          git commit -m 'Balance runline with calibrated ML and live weather'
          git push origin HEAD:fix-runline-balance

name: Apply V5 follow-up patch

on:
  push:
    branches: [repair/v5-integrity]
    paths:
      - tools/apply_v5_followup_patch.py
      - .github/workflows/apply-v5-followup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v5-integrity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/apply_v5_followup_patch.py
      - run: python -m py_compile app_mlb.py
      - name: Commit app patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mlb.py
          git commit -m 'Apply V5 follow-up app integrity fixes'
          git push origin HEAD:repair/v5-integrity

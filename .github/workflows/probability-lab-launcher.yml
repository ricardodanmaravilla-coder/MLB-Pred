name: MLB Probability Lab

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probability-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout isolated Probability Lab branch
        uses: actions/checkout@v4
        with:
          ref: experiment/probability-lab-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve V7 read-only market source and tracking configuration
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
        run: |
          gcloud run services describe mlb-pred-v7 \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json > /tmp/v7.json
          V7_URL=$(gcloud run services describe mlb-pred-v7 \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')
          test -n "$V7_URL"
          echo "MLB_PROD_URL=$V7_URL" >> "$GITHUB_ENV"
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          p=json.load(open('/tmp/v7.json'))
          spec=p.get('spec',{}).get('template',{}).get('spec',{})
          containers=spec.get('containers') or []
          envs=(containers[0].get('env') or []) if containers else []
          vals={e.get('name'):e.get('value','') for e in envs if isinstance(e,dict) and e.get('value') is not None}
          print('GOOGLE_SHEETS_ID=' + str(vals.get('GOOGLE_SHEETS_ID') or '1VsB21QUsQL5EyXu7Sek5WVeNVznECiTuoIMMB4JXno4'))
          print('BANKROLL_MXN=' + str(vals.get('BANKROLL_MXN') or '5000'))
          PY

      - name: Validate V7 live markets without production writes
        run: |
          curl -fsS --max-time 180 "$MLB_PROD_URL/api/slate" -o /tmp/v7-slate.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/v7-slate.json'))
          games=d.get('games') if isinstance(d,dict) else d
          games=games or []
          usable=sum(1 for g in games if g.get('cuota_loc') is not None and g.get('cuota_vis') is not None and g.get('linea_carreras') is not None)
          print('V7 slate games=',len(games),'usable markets=',usable)
          assert games, 'V7 slate is empty'
          assert usable > 0, 'V7 public slate has no usable live markets'
          PY

      - name: Export Google OAuth token for isolated Sheets writer
        run: |
          TOKEN=$(gcloud auth print-access-token)
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "GOOGLE_OAUTH_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run isolated Probability Lab
        run: python run_probability_lab.py

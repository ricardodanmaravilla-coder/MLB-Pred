name: MLB repair-v2-safe checks

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile app_mlb.py minero_mlb.py backtest_safe.py test_streamlit_interaction.py modules/*.py
      - name: ML smoke with repository data
        run: |
          python - <<'PY'
          import pandas as pd
          from modules.ml_mlb import PredictorMLMLB
          bat = pd.read_csv('data/mlb_batting.csv')
          pit = pd.read_csv('data/mlb_pitching.csv')
          games = pd.read_csv('data/mlb_games.csv')
          model = PredictorMLMLB()
          assert model.entrenar(bat, pit, games)
          r = model.predecir_partido('NYY', 'BOS', 72.0, 71.0, 4.1, 4.2)
          assert 0 <= r['Probabilidad_Local'] <= 100
          assert 0 <= r['Probabilidad_Visita'] <= 100
          assert abs(r['Probabilidad_Local'] + r['Probabilidad_Visita'] - 100) < 0.2
          print(r)
          PY
      - name: Monte Carlo identity and markets smoke
        run: |
          python - <<'PY'
          import pandas as pd
          from modules.montecarlo_mlb import simular_partido_mlb
          games = pd.read_csv('data/mlb_games.csv')
          r = simular_partido_mlb(
              'New York Yankees','Boston Red Sox',4.0,4.2,72.0,71.0,4.1,4.3,100.0,0,
              0,'',72,8.5,df_games=games,num_simulaciones=6000)
          assert 0 <= r['Moneyline']['Gana Local'] <= 100
          assert abs(r['Moneyline']['Gana Local'] + r['Moneyline']['Gana Visita'] - 100) < 0.01
          for line in (-5.5, -2.5, -1.5, 0.5, 1.5, 3.5, 5.5):
              assert f'Spread Local {line:+.1f}' in r['Carreras']
              assert f'Spread Visita {line:+.1f}' in r['Carreras']
          assert 'Over 8.5' in r['Carreras']
          assert r['Metadatos']['H2H_Usado_En_Probabilidad'] is False
          print(r['Moneyline'], r['Carreras']['Promedio_Total'])
          PY
      - name: No-vig odds smoke
        run: |
          python - <<'PY'
          from modules.odds_mlb import analizar_apuestas_mlb
          mc = {'Moneyline': {'Gana Local': 58.0, 'Gana Visita': 42.0}, 'Carreras': {'Over 8.5': 55.0, 'Under 8.5': 45.0, 'Push 8.5': 0.0}}
          ml = {'Probabilidad_Local': 56.0, 'Probabilidad_Visita': 44.0}
          odds = {'Moneyline_Local': 1.9, 'Moneyline_Visita': 2.05, 'Cuota_Over': 1.95, 'Cuota_Under': 1.95}
          df = analizar_apuestas_mlb(mc, ml, odds, 8.5)
          assert 'Prob Mercado No-Vig' in df.columns
          assert 'Edge' in df.columns
          print(df.to_string(index=False))
          PY
      - name: Chronological holdout backtest
        run: python backtest_safe.py | tee backtest_safe_output.txt
      - name: Stable Streamlit startup
        run: |
          streamlit run app_mlb.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          PID=$!
          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -eq 1 ]; then
            kill $PID || true
            wait $PID 2>/dev/null || true
            exit 0
          fi
          cat /tmp/streamlit.log
          kill $PID || true
          exit 1
      - name: Real Streamlit interaction smoke
        run: python test_streamlit_interaction.py

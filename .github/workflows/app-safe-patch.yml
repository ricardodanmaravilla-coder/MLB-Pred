name: Apply safe app_mlb patch

on:
  push:
    branches: [ui-safe-odds-fix]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-safe-odds-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply targeted patch only
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app_mlb.py')
          s = p.read_text(encoding='utf-8')
          original = s

          old_key = 'ODDS_API_KEY = "f9ffe1d7530a88b08e853659466c46ff"'
          new_key = '''# Prefer a private runtime secret. Keep the legacy value only as a temporary\n# compatibility fallback so the stable app does not lose live odds during migration.\ndef _get_odds_api_key():\n    key = os.getenv("ODDS_API_KEY", "").strip()\n    if key:\n        return key\n    try:\n        key = str(st.secrets.get("ODDS_API_KEY", "")).strip()\n        if key:\n            return key\n    except Exception:\n        pass\n    return "f9ffe1d7530a88b08e853659466c46ff"\n\nODDS_API_KEY = _get_odds_api_key()'''
          if old_key in s:
              s = s.replace(old_key, new_key, 1)

          # The repaired Monte Carlo already caps internally, but avoid asking for
          # huge arrays from the UI in the first place.
          s = s.replace('num_simulaciones=1000000', 'num_simulaciones=50000')
          s = s.replace('num_simulaciones=500000', 'num_simulaciones=50000')

          # Add small no-vig helpers without changing any widget or navigation.
          anchor = 'def calcular_criterio_kelly(probabilidad_real, cuota_decimal, fraccion=0.25):'
          helper = '''def _prob_no_vig_dos_vias(cuota_a, cuota_b):\n    try:\n        a, b = float(cuota_a), float(cuota_b)\n        if a <= 1 or b <= 1:\n            return None, None\n        ia, ib = 1.0 / a, 1.0 / b\n        total = ia + ib\n        return ia / total, ib / total\n    except (TypeError, ValueError, ZeroDivisionError):\n        return None, None\n\ndef _pasa_valor(prob_pct, cuota, mercado_no_vig=None, min_ev=0.03, min_edge=0.025):\n    try:\n        p = float(prob_pct) / 100.0\n        o = float(cuota)\n        ev = p * o - 1.0\n        if ev < min_ev:\n            return False\n        if mercado_no_vig is not None and (p - float(mercado_no_vig)) < min_edge:\n            return False\n        return True\n    except (TypeError, ValueError):\n        return False\n\n'''
          if '_prob_no_vig_dos_vias' not in s:
              s = s.replace(anchor, helper + anchor, 1)

          # Scanner: keep the same thresholds and rows, but require at least
          # +3% EV and +2.5 pp edge versus the paired no-vig market.
          scanner_marker = '# --- EVALUACIÓN Y FILTRO INTELIGENTE ---'
          if scanner_marker in s and 'mkt_loc_scanner' not in s:
              insert = '''# Mercado sin vig para filtrar valor real, sin cambiar las probabilidades del modelo.\n                            mkt_loc_scanner, mkt_vis_scanner = _prob_no_vig_dos_vias(cuota_loc, cuota_vis)\n                            mkt_over_scanner, mkt_under_scanner = _prob_no_vig_dos_vias(\n                                datos_partido.get("cuota_over"), datos_partido.get("cuota_under")\n                            )\n                            mkt_sp_loc_scanner, mkt_sp_vis_scanner = _prob_no_vig_dos_vias(\n                                datos_partido.get("cuota_spread_loc"), datos_partido.get("cuota_spread_vis")\n                            )\n\n                            '''
              s = s.replace(scanner_marker + '\n                            ', scanner_marker + '\n                            ' + insert, 1)

              replacements = [
                  ('if ev_loc > 0:', 'if _pasa_valor(prob_comb_loc, cuota_loc, mkt_loc_scanner):'),
                  ('if ev_vis > 0:', 'if _pasa_valor(prob_comb_vis, cuota_vis, mkt_vis_scanner):'),
                  ('if ev_over > 0:', 'if _pasa_valor(prob_comb_over, cuota_ov, mkt_over_scanner):'),
                  ('if ev_under > 0:', 'if _pasa_valor(prob_comb_under, cuota_un, mkt_under_scanner):'),
                  ('if prob_mc_spread_loc >= umbral_handicap and ev_sp_loc > 0:', 'if prob_mc_spread_loc >= umbral_handicap and _pasa_valor(prob_mc_spread_loc, cuota_sp_loc, mkt_sp_loc_scanner):'),
                  ('if prob_mc_spread_vis >= umbral_handicap and ev_sp_vis > 0:', 'if prob_mc_spread_vis >= umbral_handicap and _pasa_valor(prob_mc_spread_vis, cuota_sp_vis, mkt_sp_vis_scanner):'),
              ]
              for old, new in replacements:
                  s = s.replace(old, new, 1)

          if s != original:
              p.write_text(s, encoding='utf-8')
              print('Targeted app patch applied')
          else:
              print('App already patched')
          PY
      - run: pip install -r requirements.txt
      - name: Compile stable UI
        run: python -m py_compile app_mlb.py modules/*.py
      - name: Real Streamlit selector and button smoke
        run: python test_streamlit_interaction.py
      - name: Commit only after tests pass
        run: |
          if git diff --quiet -- app_mlb.py; then
            echo "No app changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_mlb.py
          git commit -m "Safely integrate secrets preference and no-vig filters"
          git push origin HEAD:ui-safe-odds-fix

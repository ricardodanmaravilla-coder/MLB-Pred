name: V6 official advanced metrics experiment

on:
  push:
    branches: [improve/v6-max-predictive]
    paths:
      - .github/workflows/v6-enrich-data.yml

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/v6-max-predictive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Mine official team metrics
        run: python minero_mlb.py
      - name: Mine official pitcher and bullpen FIP
        run: python minero_pitchers.py
      - name: Validate official advanced metrics
        run: |
          python - <<'PY'
          import pandas as pd
          b=pd.read_csv('data/mlb_batting.csv'); p=pd.read_csv('data/mlb_pitching.csv'); s=pd.read_csv('data/mlb_pitching_individual.csv'); r=pd.read_csv('data/mlb_bullpen.csv')
          print({'team_batting_rows':len(b),'team_pitching_rows':len(p),'starter_rows':len(s),'bullpen_teams':r['Team'].nunique()})
          assert pd.to_numeric(b['Offense_Index'],errors='coerce').notna().sum() >= 120
          assert pd.to_numeric(b['ISO'],errors='coerce').notna().sum() >= 120
          assert pd.to_numeric(p['FIP'],errors='coerce').notna().sum() >= 120
          assert pd.to_numeric(p['K-BB%'],errors='coerce').notna().sum() >= 120
          assert pd.to_numeric(s['FIP'],errors='coerce').notna().sum() >= 250
          assert pd.to_numeric(r['FIP'],errors='coerce').notna().sum() >= 29
          assert r['Team'].nunique() >= 29
          assert p['xFIP_Source'].astype(str).str.contains('FIP_USED_NOT_XFIP').all()
          PY
      - name: Walk-forward evaluation on enriched data
        run: |
          python backtest_safe.py | tee /tmp/v6_backtest_safe.txt
          python backtest_markets.py | tee /tmp/v6_backtest_markets.txt
      - name: Commit validated enriched data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mlb_batting.csv data/mlb_pitching.csv data/mlb_pitching_individual.csv data/mlb_bullpen.csv data/mlb_games.csv
          git commit -m 'V6 persist validated official advanced metrics' || exit 0
          git pull origin improve/v6-max-predictive --rebase
          git push origin HEAD:improve/v6-max-predictive

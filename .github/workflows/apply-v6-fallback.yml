name: Apply V6 fallback patch
on:
  push:
    branches: [upgrade/v6-max-predictive]
    paths:
      - tools/apply_v6_fallback_patch.py
      - .github/workflows/apply-v6-fallback.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/v6-max-predictive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/apply_v6_fallback_patch.py
      - run: python -m py_compile app_mlb.py
      - name: Commit live fallback patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mlb.py
          git commit -m 'V6 use quality-aware live pitching fallbacks'
          git pull --rebase origin upgrade/v6-max-predictive
          git push origin HEAD:upgrade/v6-max-predictive

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <title>MLB Quant Analytics V7</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e5edf7;background:#08111f}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#14213a 0,#08111f 40%);min-height:100vh}
    .wrap{max-width:1120px;margin:auto;padding:18px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
    h1{font-size:clamp(1.7rem,4vw,2.6rem);margin:0}.sub{color:#9db0c8;margin-top:7px}.badge{padding:8px 12px;border:1px solid #29405f;border-radius:999px;background:#101d30;color:#c8d8ed;font-size:.88rem}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:#3b82f6;color:#fff}.secondary{background:#17263b;color:#d8e6f7}.btn:disabled{opacity:.45;cursor:wait}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:rgba(14,25,42,.92);border:1px solid #223651;border-radius:16px;padding:15px;box-shadow:0 12px 40px rgba(0,0,0,.15)}
    .metric .label{font-size:.75rem;color:#8da3be;text-transform:uppercase;letter-spacing:.08em}.metric .value{font-size:1.25rem;font-weight:800;margin-top:5px}
    h2{margin:24px 0 10px;font-size:1.15rem}.games,.picks{display:grid;gap:12px}.game{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}.team{font-weight:750}.right{text-align:right}.muted{color:#8ea2ba;font-size:.85rem}.market{display:grid;grid-template-columns:1.6fr 1.2fr repeat(5,.72fr);gap:8px;align-items:center}.market strong{font-size:.98rem}.pill{padding:5px 8px;border-radius:999px;text-align:center;font-size:.8rem;background:#15263b}.good{background:#123c2a;color:#8df0bc}.warn{background:#452a18;color:#ffcb8a}.error{background:#421d25;color:#ffadb9}
    .empty{padding:24px;text-align:center;color:#90a5bf;border:1px dashed #2b405d;border-radius:14px}.status{margin:10px 0;color:#9db0c8}.spin{display:inline-block;width:14px;height:14px;border:2px solid #54708f;border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:8px}@keyframes s{to{transform:rotate(360deg)}}
    details{margin-top:12px}.diag{font-size:.86rem;overflow:auto}.diag table{width:100%;border-collapse:collapse}.diag th,.diag td{text-align:left;padding:8px;border-bottom:1px solid #1d314a;white-space:nowrap}
    @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.market{grid-template-columns:1fr 1fr}.market .hide-mobile{display:none}}
    @media(max-width:520px){.wrap{padding:12px}.grid{grid-template-columns:1fr 1fr}.game{grid-template-columns:1fr}.right{text-align:left}.market{grid-template-columns:1fr}.hero{align-items:flex-start}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div><h1>⚾ MLB Quant Analytics V7</h1><div class="sub">Big Data · ML · Monte Carlo · No-vig · Kelly · Cloud Run</div></div>
    <div class="badge" id="healthBadge">Conectando…</div>
  </div>
  <div class="grid">
    <div class="card metric"><div class="label">Modelo</div><div class="value" id="model">—</div></div>
    <div class="card metric"><div class="label">Training rows</div><div class="value" id="rows">—</div></div>
    <div class="card metric"><div class="label">Señales</div><div class="value" id="signals">—</div></div>
    <div class="card metric"><div class="label">Cuotas</div><div class="value" id="odds">—</div></div>
  </div>
  <div class="toolbar">
    <button class="btn secondary" id="slateBtn">Actualizar cartelera</button>
    <button class="btn primary" id="scanBtn">🚀 Ejecutar scanner V7</button>
  </div>
  <div class="status" id="status"></div>

  <h2>Cartelera oficial</h2><div class="games" id="games"><div class="empty">Cargando partidos…</div></div>
  <h2>Mejores oportunidades</h2><div class="picks" id="picks"><div class="empty">Ejecuta el scanner para buscar valor.</div></div>
  <details><summary>Diagnóstico del scanner</summary><div class="diag" id="diag"></div></details>
</div>
<script>
const $=id=>document.getElementById(id);
const fmt=v=>(v===null||v===undefined)?'—':v;
let healthState={};
function busy(on,msg=''){['scanBtn','slateBtn'].forEach(id=>$(id).disabled=on);$('status').innerHTML=on?`<span class="spin"></span>${msg}`:msg}
function gameCard(g){return `<div class="card game"><div><div class="muted">VISITA</div><div class="team">${g.away}</div><div class="muted">${g.away_pitcher||'Por anunciar'}</div></div><div class="pill">@</div><div class="right"><div class="muted">LOCAL</div><div class="team">${g.home}</div><div class="muted">${g.home_pitcher||'Por anunciar'}</div><div class="muted">O/U ${fmt(g.linea_carreras)} · ML ${fmt(g.cuota_loc)} / ${fmt(g.cuota_vis)}</div></div></div>`}
function pickCard(p){return `<div class="card market"><div><div class="muted">${p.partido}</div><strong>${p.apuesta}</strong></div><div>${p.mercado}</div><div class="pill good">${p.probabilidad}%</div><div class="pill">${p.cuota}</div><div class="hide-mobile">EV ${p.ev_pct}%</div><div class="hide-mobile">Edge ${p.edge_pp}pp</div><div class="pill">Kelly ${p.kelly_pct}%</div></div>`}
function errorTable(errors){if(!errors||!errors.length)return '';return `<table><thead><tr><th>Partido</th><th>Error</th></tr></thead><tbody>${errors.map(x=>`<tr><td>${x.partido||x.game_pk||'—'}</td><td>${x.error||'—'}</td></tr>`).join('')}</tbody></table>`}
async function health(){try{const r=await fetch('/api/health');const d=await r.json();healthState=d;$('healthBadge').textContent=d.status==='ok'?'● Sistema operativo':'● Modo degradado';$('model').textContent=d.training_source||'—';$('rows').textContent=(d.training_rows||0).toLocaleString();$('signals').textContent=d.signal_set||'—';$('odds').textContent=d.odds_configured?'En vivo':'Sin API';if(!d.odds_configured){$('odds').classList.add('error');$('status').textContent='⚠️ ODDS_API_KEY no configurada en Cloud Run. La cartelera funciona, pero el scanner no puede validar EV/edge sin cuotas reales.'}}catch(e){$('healthBadge').textContent='● Sin conexión'}}
async function slate(){busy(true,'Sincronizando MLB StatsAPI y mercado…');try{const r=await fetch('/api/slate');if(!r.ok)throw new Error(await r.text());const d=await r.json();$('games').innerHTML=d.games.length?d.games.map(gameCard).join(''):'<div class="empty">No hay partidos programados para esta fecha.</div>';busy(false,`${d.games.length} partidos encontrados · ${d.date}${healthState.odds_configured?'':' · SIN CUOTAS'}`)}catch(e){busy(false,`Error: ${e.message}`)}}
async function scan(){if(healthState.odds_configured===false){$('picks').innerHTML='<div class="empty error"><strong>Scanner no evaluable.</strong><br>Falta configurar ODDS_API_KEY en Cloud Run. Esto no es un NO BET del modelo.</div>';busy(false,'Configura ODDS_API_KEY para igualar el scanner de Streamlit.');return;}busy(true,'Ejecutando ML + Monte Carlo + filtros de valor…');$('picks').innerHTML='<div class="empty"><span class="spin"></span>Analizando toda la jornada…</div>';try{const r=await fetch('/api/scan',{method:'POST'});if(!r.ok)throw new Error(await r.text());const d=await r.json();$('picks').innerHTML=d.recommendations.length?d.recommendations.map(pickCard).join(''):'<div class="empty">NO BET: ninguna apuesta superó los filtros calibrados.</div>';const rows=d.diagnostics||[];$('diag').innerHTML=rows.length?`<table><thead><tr><th>Partido</th><th>Apuesta</th><th>ML</th><th>MC</th><th>Prob</th><th>EV</th><th>Edge</th><th>Estado</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.partido}</td><td>${x.apuesta}</td><td>${x.prob_ml}%</td><td>${x.prob_mc}%</td><td>${x.probabilidad}%</td><td>${x.ev_pct}%</td><td>${x.edge_pp}pp</td><td><span class="pill ${x.accepted?'good':'warn'}">${x.accepted?'PICK':'NO BET'}</span></td></tr>`).join('')}</tbody></table>`:errorTable(d.errors);busy(false,`Scanner completo · ${d.games_seen} juegos · ${d.recommendations.length} recomendaciones · ${d.errors.length} no evaluados`)}catch(e){$('picks').innerHTML='<div class="empty error">No se pudo completar el scanner.</div>';busy(false,`Error: ${e.message}`)}}
$('slateBtn').addEventListener('click',slate);$('scanBtn').addEventListener('click',scan);health();slate();
</script>
</body></html>
